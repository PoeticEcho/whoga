services:
  collector:
    build:
      context: ..
      dockerfile: nas/Dockerfile
    image: whoga-nas:1.0
    platform: linux/amd64
    init: true
    restart: "no"
    user: "${NAS_UID:?Set NAS_UID}:${NAS_GID:?Set NAS_GID}"
    command: ["probe"]
    environment:
      HOME: /tmp
      TZ: Asia/Seoul
    volumes:
      - ../collector-runs/nas:/output
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    shm_size: 512m
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 256
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp_profile.json
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"
