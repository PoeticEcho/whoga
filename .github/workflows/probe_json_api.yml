name: whoga · JSON API 직접 요청 시험

on:
  workflow_dispatch:
  push:
    branches: [actions-map-trial]
    paths:
      - '.github/workflows/probe_json_api.yml'
      - 'scripts/probe_json_api.py'
      - 'config/api-probe.json'

permissions:
  contents: read

jobs:
  json-api:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the reference HTTP client
        run: python -m pip install 'requests>=2.32,<3'
      - name: Request the exact reference JSON URL once
        run: python scripts/probe_json_api.py
      - name: Preserve structural diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: json-api-probe
          path: probe-results/json-api-probe.json
          if-no-files-found: ignore
          retention-days: 7
