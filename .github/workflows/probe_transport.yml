name: whoga · 통신 호환성 비교

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe_transport.yml'
      - 'scripts/probe_transport.py'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install comparison client
        run: python -m pip install 'curl-cffi==0.16.3'
      - name: Compare one request per client
        run: python scripts/probe_transport.py
