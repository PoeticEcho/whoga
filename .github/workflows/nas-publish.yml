name: whoga · NAS JSON to public app
on:
  push:
    branches: [main, map-collector-v2]
    paths-ignore: ['_state/**', '**.md']
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: beomeo-w-daily-pages
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.persist.outputs.changed }}
      digest: ${{ steps.persist.outputs.digest }}
    steps:
      # Only main supplies executable code. The NAS branch supplies JSON only.
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Fetch NAS uploads
        run: git fetch origin map-collector-v2:refs/remotes/origin/nas-input
      - name: Validate and convert complete NAS snapshots
        run: python scripts/import_nas.py --source-ref refs/remotes/origin/nas-input
      - name: Validate application data and comparisons
        run: |
          python -m unittest discover -s tests -v
          node --test tests/*.test.mjs
          python scripts/build_site.py
      - name: Persist imported data
        id: persist
        env:
          FORCE_DEPLOY: ${{ github.event_name != 'schedule' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ complexes.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: publish validated NAS observations [skip ci]'
            git push origin HEAD:main
          fi
          digest=$(python - <<'PYHASH'
          import hashlib
          from pathlib import Path
          digest=hashlib.sha256()
          for path in sorted(Path('_site').rglob('*')):
              if path.is_file():
                  digest.update(str(path.relative_to('_site')).encode()+b'\0'+path.read_bytes()+b'\0')
          print(digest.hexdigest())
          PYHASH
          )
          published=$(cat _state/whoga-pages.sha256 2>/dev/null || true)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = refs/heads/main ] && { [ "$FORCE_DEPLOY" = true ] || [ "$digest" != "$published" ]; }; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      # Import-branch jobs persist data only. Main polls the content digest and deploys.
      # The digest is acknowledged only after deployment; failed deployments retry.
      - uses: actions/upload-pages-artifact@v4
        if: steps.persist.outputs.changed == 'true'
        with:
          path: _site
  deploy:
    needs: import
    if: needs.import.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Record successfully deployed content
        env:
          SITE_DIGEST: ${{ needs.import.outputs.digest }}
        run: |
          python - <<'PYHASH'
          import os,re
          from pathlib import Path
          digest=os.environ['SITE_DIGEST']
          assert re.fullmatch('[a-f0-9]{64}',digest)
          Path('_state').mkdir(exist_ok=True)
          Path('_state/whoga-pages.sha256').write_text(digest+'\n')
          PYHASH
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f _state/whoga-pages.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record published NAS app content [skip ci]'
            git push origin HEAD:main
          fi
