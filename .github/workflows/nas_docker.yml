name: whoga · nas Docker build and smoke
on:
  push:
    branches: [map-collector-v2]
    paths: ['nas/**', '.github/workflows/nas_docker.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Gate and dashboard regression tests
        run: |
          python3 -m unittest discover -s nas -v
          node --check nas/static/app.js
          sh -n nas/setup.sh
      - name: Prepare isolated output
        run: |
          mkdir -p collector-runs/nas nas-config
          printf 'NAS_UID=%s\nNAS_GID=%s\nDASHBOARD_PASSWORD=ci-only-dashboard-test\nNAS_BIND_IP=127.0.0.1\n' "$(id -u)" "$(id -g)" > nas/.env
      - name: Validate Compose
        working-directory: nas
        run: docker compose config --quiet
      - name: Build pinned image
        working-directory: nas
        run: docker compose build collector
      - name: Launch dashboard
        working-directory: nas
        run: docker compose up -d --wait
      - name: Browser dashboard integration and screenshots
        working-directory: nas
        run: docker compose exec -T collector python - < check_dashboard.py
      - name: Container logs
        if: always()
        working-directory: nas
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nas-dashboard-${{ github.run_id }}
          path: collector-runs/nas/
          retention-days: 7
          if-no-files-found: warn
      - name: Stop dashboard
        if: always()
        working-directory: nas
        run: docker compose down
